spring.application.name=ms-consultorias
spring.profiles.default=dev
jwt.secret=${JWT_SECRET}
app.security.docs-public=${APP_SECURITY_DOCS_PUBLIC:true}
logging.pattern.level=%5p [requestId=%X{requestId:-na}]

# ===========================================
# H2 DATABASE (DESARROLLO)
# ===========================================
spring.datasource.url=jdbc:h2:mem:consultorias_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===========================================
# JPA / HIBERNATE
# ===========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================================
# RABBITMQ
# ===========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:rabbit_local_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rabbit_local_password}
rabbitmq.exchange.name=consultoria.exchange
rabbitmq.queue.name=consultoria.queue
rabbitmq.routing.key=consultoria.routingkey

# ===========================================
# ACTUATOR
# ===========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===========================================
# SWAGGER / SPRINGDOC
# ===========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ===========================================
# SERVER PORT
# ===========================================
server.port=${SERVER_PORT:8086}
