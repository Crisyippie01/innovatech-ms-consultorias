spring.application.name=ms-consultorias
spring.profiles.default=local
jwt.secret=${JWT_SECRET:change-me-jwt-secret-min-32-chars}
app.security.docs-public=${APP_SECURITY_DOCS_PUBLIC:true}
logging.pattern.level=%5p [requestId=%X{requestId:-na}]
rabbitmq.exchange.name=consultoria.exchange
rabbitmq.queue.name=consultoria.queue
rabbitmq.routing.key=consultoria.routingkey

# ===========================================
# ACTUATOR
# ===========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===========================================
# SWAGGER / SPRINGDOC
# ===========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ===========================================
# SERVER PORT
# ===========================================
server.port=${SERVER_PORT:8086}
