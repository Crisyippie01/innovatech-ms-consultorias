spring.datasource.url=jdbc:mysql://${DB_HOST:${CONSULTORIAS_MYSQL_HOST:localhost}}:${DB_PORT:${CONSULTORIAS_MYSQL_PORT:3306}}/${DB_NAME:${CONSULTORIAS_MYSQL_DATABASE:innovatech_consultorias}}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:${CONSULTORIAS_MYSQL_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${CONSULTORIAS_MYSQL_PASSWORD:change_me_local_consultorias}}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:rabbit_local_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rabbit_local_password}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
spring.h2.console.enabled=false
