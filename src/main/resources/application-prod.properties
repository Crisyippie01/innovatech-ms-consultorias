spring.application.name=ms-consultorias
jwt.secret=${JWT_SECRET}
app.security.docs-public=false

# ===========================================
# MYSQL DATABASE (PRODUCCIÓN)
# ===========================================
spring.datasource.url=jdbc:mysql://${CONSULTORIAS_MYSQL_HOST}:${CONSULTORIAS_MYSQL_PORT}/${CONSULTORIAS_MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${CONSULTORIAS_MYSQL_USERNAME}
spring.datasource.password=${CONSULTORIAS_MYSQL_PASSWORD}

# ===========================================
# JPA / HIBERNATE
# ===========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===========================================
# RABBITMQ (Configuración de Producción)
# ===========================================
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
rabbitmq.exchange.name=consultoria.exchange
rabbitmq.queue.name=consultoria.queue
rabbitmq.routing.key=consultoria.routingkey

# ===========================================
# ACTUATOR (Producción - Seguridad)
# ===========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ===========================================
# SERVER (Puerto configurable)
# ===========================================
server.port=${SERVER_PORT:8086}
