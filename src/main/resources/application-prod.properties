spring.application.name=ms-consultorias

# ===========================================
# MYSQL DATABASE (PRODUCCIÓN)
# ===========================================
spring.datasource.url=jdbc:mysql://localhost:3306/consultorias_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# ===========================================
# JPA / HIBERNATE
# ===========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===========================================
# RABBITMQ (Configuración de Producción)
# ===========================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# ===========================================
# ACTUATOR (Producción - Seguridad)
# ===========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ===========================================
# SERVER (Puerto configurable)
# ===========================================
server.port=${SERVER_PORT:8086}
